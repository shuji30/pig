<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- アプリのアイコン。ゲームと同じロココの配色で、等角の小部屋を描いている。
       マスク（丸く切られる形）でも欠けないよう、中身は中央 60% に収めてある -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6f0" />
      <stop offset="1" stop-color="#ffc9de" />
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93aeb3" />
      <stop offset="1" stop-color="#7e9aa0" />
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c1c5" />
      <stop offset="1" stop-color="#8fa9ae" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- 奥の壁（左・右） -->
  <polygon points="106,300 106,186 256,111 256,225" fill="url(#wallL)" />
  <polygon points="256,225 256,111 406,186 406,300" fill="url(#wallR)" />
  <!-- 壁の上端の明るい縁 -->
  <polygon points="106,186 256,111 256,124 106,199" fill="#c3d8db" />
  <polygon points="256,111 406,186 406,199 256,124" fill="#d3e4e6" />

  <!-- 床 -->
  <polygon points="106,300 256,225 406,300 256,375" fill="#f4ead9" />
  <polygon points="256,225 406,300 256,375" fill="#ece0cb" />
  <!-- 床の目地 -->
  <g stroke="#e0d2b9" stroke-width="3" opacity="0.9">
    <line x1="181" y1="262" x2="331" y2="337" />
    <line x1="331" y1="262" x2="181" y2="337" />
  </g>

  <!-- 右の壁の窓 -->
  <polygon points="316,181 372,209 372,258 316,230" fill="#ffe9a8" stroke="#cfa855" stroke-width="5" />

  <!-- 左の壁に掛けた絵 -->
  <polygon points="140,214 186,191 186,235 140,258" fill="#f7e2e8" stroke="#cfa855" stroke-width="5" />

  <!-- ロココのいす（背もたれ・座面・脚） -->
  <polygon points="222,246 258,228 258,268 222,286" fill="#e6a9bd" stroke="#cfa855" stroke-width="4" />
  <polygon points="222,286 258,268 296,287 260,305" fill="#f4d3dd" stroke="#cfa855" stroke-width="4" />
  <line x1="228" y1="292" x2="228" y2="312" stroke="#cfa855" stroke-width="7" />
  <line x1="290" y1="292" x2="290" y2="312" stroke="#cfa855" stroke-width="7" />

  <!-- はちうえ -->
  <ellipse cx="352" cy="316" rx="19" ry="10" fill="#e0cba8" />
  <rect x="337" y="294" width="30" height="24" rx="5" fill="#e9d6b4" stroke="#cfa855" stroke-width="3" />
  <circle cx="345" cy="284" r="14" fill="#6fbf63" />
  <circle cx="361" cy="288" r="12" fill="#5da555" />
  <circle cx="353" cy="272" r="12" fill="#7fcc72" />
</svg>
