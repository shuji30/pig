name: Deploy to GitHub Pages

on:
  push:
    branches:
      # 既定ブランチが変わった場合はここに追記する
      - main
      - claude/piglike-sandbox-game-supj1g
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に1つだけ。実行中のものは完走させる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # tsc --noEmit + vitest run + vite build（出力は dist/）。テストが落ちたら公開しない
      - run: npm run build

      # 先に成果物を上げてしまうことで、Pages 側の設定に失敗してもビルドの結果は残る
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Pages がまだ作られていない場合に作成する（public リポジトリなら GITHUB_TOKEN で可能）
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
