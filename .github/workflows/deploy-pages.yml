name: Deploy to GitHub Pages

on:
  push:
    branches:
      # 既定ブランチが変わった場合はここに追記する
      - main
      - claude/piglike-sandbox-game-supj1g
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に1つだけ。実行中のものは完走させる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # tsc --noEmit + vite build（出力は dist/）
      - run: npm run build

      # Pages の有効化（Settings → Pages → Source: GitHub Actions）は初回だけ手作業。
      # GITHUB_TOKEN からは有効化できないため、ここでは既存の設定を読むだけにする
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
